org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin and a new DSL that conflict with the Kotlin
# Multiplatform `com.android.application` setup. AGP's own error message
# recommends these two flags as the compatibility path for KMP app modules.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
